name: Build Files

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  SOLUTION_PATH: '${{ github.workspace }}\\Files.slnx'
  APP_PROJECT_PATH: '${{ github.workspace }}\\src\\Files.App\\Files.App.csproj'

jobs:
  build:
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        platform: [x64]

    env:
      ARCHITECTURE: ${{ matrix.platform }}
      CONFIGURATION: Release

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Create self signed cert
        run: ./.github/scripts/Generate-SelfCertPfx.ps1 -Destination "${{ github.workspace }}\.github\workflows\FilesApp_SelfSigned.pfx"

      - name: Restore Files
        run: |
          msbuild $env:SOLUTION_PATH `
            -t:Restore `
            -p:Platform=$env:ARCHITECTURE `
            -p:Configuration=$env:CONFIGURATION `
            -p:PublishReadyToRun=true `
            -v:quiet

      - name: Build & package Files
        run: |
          msbuild $env:APP_PROJECT_PATH `
            -t:Build `
            -p:Configuration=$env:CONFIGURATION `
            -p:Platform=$env:ARCHITECTURE `
            -p:AppxBundle=Always `
            -p:AppxBundlePlatforms=$env:ARCHITECTURE `
            -p:GenerateAppxPackageOnBuild=true `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageDir=${{ github.workspace }}\artifacts\AppxPackages\ `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateKeyFile=${{ github.workspace }}\.github\workflows\FilesApp_SelfSigned.pfx `
            -p:PackageCertificatePassword="" `
            -p:PackageCertificateThumbprint="" `
            -v:quiet

      - name: Upload MSIX package
        uses: actions/upload-artifact@v7
        with:
          name: 'Files-MSIX-${{ env.ARCHITECTURE }}'
          path: ${{ github.workspace }}\artifacts\AppxPackages\*

      - name: List package files
        shell: pwsh
        run: |
          Get-ChildItem "${{ github.workspace }}\artifacts\AppxPackages\" -Recurse -File | ForEach-Object { Write-Host $_.FullName }

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.0.0-${{ github.run_id }}
        shell: pwsh
        run: |
          $release = gh release create $env:TAG `
            "${{ github.workspace }}\artifacts\AppxPackages\*.msix" `
            "${{ github.workspace }}\artifacts\AppxPackages\*.msixbundle" `
            --repo ${{ github.repository }} `
            --title "Files Build (${{ env.ARCHITECTURE }})" `
            --notes "Automated build of Files for ${{ env.ARCHITECTURE }}." `
            --latest
          Write-Host "Release created: $release"
